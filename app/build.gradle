plugins {
    id 'com.android.application'
}

def vc = (project.findProperty('vc') ?: '1').toString().toInteger()

android {
    namespace 'uz.vchat.secret'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.vchat.secret'
        minSdk 26
        targetSdk 34
        versionCode vc
        versionName "1.0.${vc}"
    }

    signingConfigs {
        fixed {
            // Kalit repoda saqlanmaydi: GitHub Secrets'dan (KEYSTORE_B64, KEYSTORE_PASS) olinadi
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'missing.keystore')
            storePassword System.getenv('KEYSTORE_PASS') ?: ''
            keyAlias 'vchat'
            keyPassword System.getenv('KEYSTORE_PASS') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
