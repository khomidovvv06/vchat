name: APK yig'ish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Taklif havolalarini sozlash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s|__OWNER__|$OWNER|g; s|__REPO__|$REPO|g" app/src/main/assets/www/index.html

      - name: APK yig'ish
        run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }}

      - run: cp app/build/outputs/apk/release/app-release.apk vchat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vchat-apk
          path: vchat.apk

      - name: Release'ga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VChat (oxirgi versiya)
          body: "Telefoningizga vchat.apk faylini yuklab oling va o'rnating."
          files: vchat.apk
          make_latest: true
