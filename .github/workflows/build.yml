name: APK yig'ish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Taklif havolalarini sozlash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s|__OWNER__|$OWNER|g; s|__REPO__|$REPO|g" app/src/main/assets/www/index.html

      - name: Imzolash kalitini tiklash
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::KEYSTORE_B64 secret qo'shilmagan (Settings -> Secrets and variables -> Actions)"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/vchat.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/vchat.keystore" >> "$GITHUB_ENV"

      - name: APK yig'ish
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }}

      - run: cp app/build/outputs/apk/release/app-release.apk vchat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vchat-apk
          path: vchat.apk

      - name: Release'ga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VChat (oxirgi versiya)
          body: "Telefoningizga vchat.apk faylini yuklab oling va o'rnating."
          files: vchat.apk
          make_latest: true

  # iPhone/veb versiyasi: docs/ + ilova fayllari GitHub Pages'ga avtomatik joylanadi
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Saytni tayyorlash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          mkdir -p _site/app
          cp -r docs/. _site/
          cp -r app/src/main/assets/www/. _site/app/
          sed -i "s|__OWNER__|$OWNER|g; s|__REPO__|$REPO|g" _site/app/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
